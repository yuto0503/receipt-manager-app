services:
  backend:
    build:
      context: ./backend
    container_name: receipt-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    container_name: receipt-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: receipt-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: receipt_app
    volumes:
      - mysql_data:/var/lib/mysql

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    depends_on:
      - mysql

volumes:
  mysql_data: