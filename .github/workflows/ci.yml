name: CI

# Do not add paths/paths-ignore: required PR checks must always be reported.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep these check names stable; do not reuse them in other workflows.
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Verify build environment
        run: |
          test ! -e .env
          test ! -e .env.local
          test ! -e .env.production
          test ! -e .env.production.local
          test -z "${SERVER_API_BASE_URL:-}"
      # Keep failures fatal: no continue-on-error or shell success fallback.
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Build
        # No Go API or .env files are needed at build time.
        run: npm run build
      - name: Check dynamic receipt page
        run: node tests/check-build.mjs

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: receipt_ci
          MYSQL_ROOT_PASSWORD: ci-password
        options: >-
          --health-cmd="mysql --protocol=TCP -h 127.0.0.1 -uroot -pci-password receipt_ci -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Report implementation stage
        run: echo 'Common settings only; backend checks are not implemented yet.'
